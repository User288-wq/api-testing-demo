name: API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install

      - name: Functional tests
        run: npm run test:dev

      - name: Security tests
        run: npx newman run tests/api/collections/security-tests.json -e tests/api/environments/dev.json

      - name: Performance tests (k6)
        uses: grafana/k6-action@v0.3.0
        with:
          filename: tests/performance/load-test.js
          flags: --out json=reports/performance-metrics.json

      - name: Generate Dashboard
        run: node scripts/generate-dashboard.js

      - name: Upload Dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: docs/

      - name: Send email notification (SendGrid)
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || 'diaraf1993diouf@gmail.com' }}
        run: node scripts/email-notifier.js
