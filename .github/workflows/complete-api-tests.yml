name: API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run API tests
        run: npm run test:dev

      - name: Generate Dashboard
        run: node scripts/generate-dashboard.js

      - name: Upload Dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: docs/

      - name: Generate Dashboard
        run: node scripts/generate-dashboard.js

      - name: Upload Dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: docs/

      - name: Send email notification (Ethereal)
        run: node scripts/email-notifier.js

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Run security tests
        run: npx newman run tests/api/collections/security-tests.json -e tests/api/environments/dev.json
